name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # one version failing should not hide whether the others pass
      fail-fast: false
      matrix:
        # pnpm 11 requires Node >= 22.13. The published library targets Node >= 20.11;
        # that floor is enforced by packages/core engines, not by this matrix.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
